<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAnalitica" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2950"/>
      <stop offset="50%" stop-color="#153e75"/>
      <stop offset="100%" stop-color="#1f57a3"/>
    </linearGradient>
    <linearGradient id="chartGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38a169"/>
      <stop offset="100%" stop-color="#22543d"/>
    </linearGradient>
    <linearGradient id="chartGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecc94b"/>
      <stop offset="100%" stop-color="#975a16"/>
    </linearGradient>
    <linearGradient id="chartGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e53e3e"/>
      <stop offset="100%" stop-color="#742a2a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo de tecnología y analítica -->
  <rect width="800" height="500" rx="16" fill="url(#bgAnalitica)"/>

  <!-- Cuadrícula isométrica sutil de datos -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.08">
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="650" y1="0" x2="650" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Título del Dashboard y Analítica -->
  <text x="50" y="60" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="24" font-weight="bold">MONITOREO DE CONTROL DE GESTIÓN</text>
  <text x="50" y="85" fill="#63b3ed" font-family="'Inter', sans-serif" font-size="14">6 Delegaciones Territoriales &bull; Semáforo &bull; Cuellos de Botella</text>

  <!-- Panel 1: Indicador de Semáforo Diario -->
  <rect x="50" y="110" width="210" height="230" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
  <text x="70" y="140" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="15" font-weight="600">Semáforo de Plazos</text>
  
  <!-- Círculos de Semáforo -->
  <g transform="translate(80, 160)">
    <!-- Verde -->
    <circle cx="20" cy="20" r="16" fill="#38a169" filter="url(#glow)"/>
    <text x="50" y="25" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Día 1-3 (Normal)</text>
    
    <!-- Amarillo -->
    <circle cx="20" cy="65" r="16" fill="#ecc94b" filter="url(#glow)"/>
    <text x="50" y="70" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Día 4-5 (Alerta)</text>
    
    <!-- Rojo -->
    <circle cx="20" cy="110" r="16" fill="#e53e3e" filter="url(#glow)"/>
    <text x="50" y="115" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Día 6+ (Crítico)</text>
  </g>

  <!-- Panel 2: Gráfico de Carga por Delegación -->
  <rect x="280" y="110" width="470" height="230" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
  <text x="300" y="140" fill="#e2e8f0" font-family="'Outfit', sans-serif" font-size="15" font-weight="600">Distribución de Casos por Delegación</text>

  <!-- Barras de Gráfico -->
  <g transform="translate(300, 160)">
    <!-- Central -->
    <rect x="10" y="60" width="40" height="90" rx="4" fill="#4299e1"/>
    <text x="30" y="170" fill="#cbd5e0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Central</text>
    <text x="30" y="50" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">24%</text>

    <!-- Rural -->
    <rect x="80" y="80" width="40" height="70" rx="4" fill="#3182ce"/>
    <text x="100" y="170" fill="#cbd5e0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Rural</text>
    <text x="100" y="70" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">18%</text>

    <!-- La Antena -->
    <rect x="150" y="90" width="40" height="60" rx="4" fill="#38a169"/>
    <text x="170" y="170" fill="#cbd5e0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Antena</text>
    <text x="170" y="80" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">15%</text>

    <!-- La Pampa -->
    <rect x="220" y="75" width="40" height="75" rx="4" fill="#4299e1"/>
    <text x="240" y="170" fill="#cbd5e0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Pampa</text>
    <text x="240" y="65" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">19%</text>

    <!-- Av. del Mar -->
    <rect x="290" y="105" width="40" height="45" rx="4" fill="#ecc94b"/>
    <text x="310" y="170" fill="#cbd5e0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Av. Mar</text>
    <text x="310" y="95" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">12%</text>

    <!-- Las Compañías (Mayor demanda) -->
    <rect x="360" y="30" width="40" height="120" rx="4" fill="#e53e3e" filter="url(#glow)"/>
    <text x="380" y="170" fill="#fbd38d" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Compañías</text>
    <text x="380" y="20" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">32%</text>
  </g>

  <!-- Panel Inferior 3: Tarjetas de KPI Rápidas -->
  <g transform="translate(50, 360)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="220" height="90" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#38a169" stroke-width="1.5"/>
    <text x="20" y="30" fill="#a0aec0" font-family="'Inter', sans-serif" font-size="12">Cumplimiento Global</text>
    <text x="20" y="65" fill="#48bb78" font-family="'Outfit', sans-serif" font-size="28" font-weight="bold">82.4%</text>
    <text x="140" y="60" fill="#68d391" font-family="'Inter', sans-serif" font-size="12">↗ +4.1%</text>

    <!-- KPI 2 -->
    <rect x="240" y="0" width="220" height="90" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ecc94b" stroke-width="1.5"/>
    <text x="260" y="30" fill="#a0aec0" font-family="'Inter', sans-serif" font-size="12">Tiempo Medio de Respuesta</text>
    <text x="260" y="65" fill="#ecc94b" font-family="'Outfit', sans-serif" font-size="28" font-weight="bold">3.8 d</text>
    <text x="380" y="60" fill="#ecc94b" font-family="'Inter', sans-serif" font-size="12">Meta: 4d</text>

    <!-- KPI 3 -->
    <rect x="480" y="0" width="220" height="90" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#e53e3e" stroke-width="1.5"/>
    <text x="500" y="30" fill="#a0aec0" font-family="'Inter', sans-serif" font-size="12">Tasa Cuellos de Botella</text>
    <text x="500" y="65" fill="#fc8181" font-family="'Outfit', sans-serif" font-size="28" font-weight="bold">17.6%</text>
    <text x="620" y="60" fill="#fc8181" font-family="'Inter', sans-serif" font-size="12">Critico</text>
  </g>
</svg>
