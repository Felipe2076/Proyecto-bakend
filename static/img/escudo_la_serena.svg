<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="escudoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#153e75"/>
      <stop offset="100%" stop-color="#0d2950"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c767"/>
      <stop offset="50%" stop-color="#e5a93c"/>
      <stop offset="100%" stop-color="#b87d19"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Escudo Base -->
  <path d="M 100,10 C 155,10 180,25 180,90 C 180,145 140,175 100,192 C 60,175 20,145 20,90 C 20,25 45,10 100,10 Z" 
        fill="url(#escudoGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#dropShadow)"/>

  <!-- Borde interno dorado -->
  <path d="M 100,18 C 148,18 170,30 170,90 C 170,138 135,165 100,180 C 65,165 30,138 30,90 C 30,30 52,18 100,18 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Corona Mural / Campanario superior -->
  <g fill="url(#goldGrad)">
    <rect x="75" y="32" width="50" height="10" rx="2"/>
    <rect x="70" y="24" width="12" height="12" rx="1"/>
    <rect x="94" y="20" width="12" height="16" rx="1"/>
    <rect x="118" y="24" width="12" height="12" rx="1"/>
  </g>

  <!-- Faro y Mar (Símbolo de La Serena) -->
  <!-- Olas del mar -->
  <path d="M 45,130 Q 70,120 100,130 T 155,130 C 155,150 130,165 100,174 C 70,165 45,150 45,130 Z" fill="#1f57a3" opacity="0.8"/>
  <path d="M 40,140 Q 70,132 100,140 T 160,140" fill="none" stroke="#63b3ed" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50,152 Q 75,145 100,152 T 150,152" fill="none" stroke="#bee3f8" stroke-width="2" stroke-linecap="round"/>

  <!-- Silueta Faro Monumental -->
  <g fill="#ffffff">
    <!-- Base faro -->
    <path d="M 90,125 L 110,125 L 107,75 L 93,75 Z" fill="#f7fafc"/>
    <!-- Franjas rojas / detalles -->
    <rect x="92" y="85" width="16" height="8" fill="#e53e3e"/>
    <rect x="91" y="103" width="18" height="8" fill="#e53e3e"/>
    <!-- Linterna y cúpula -->
    <rect x="91" y="68" width="18" height="7" fill="#2d3748" rx="1"/>
    <circle cx="100" cy="65" r="7" fill="url(#goldGrad)"/>
    <path d="M 93,65 Q 100,55 107,65 Z" fill="#c53030"/>
    <circle cx="100" cy="54" r="2" fill="url(#goldGrad)"/>
  </g>

  <!-- Haces de luz -->
  <polygon points="100,65 35,45 40,85" fill="#fefcbf" opacity="0.35"/>
  <polygon points="100,65 165,45 160,85" fill="#fefcbf" opacity="0.35"/>

  <!-- Estrellas / Guirnaldas -->
  <circle cx="65" cy="55" r="3" fill="url(#goldGrad)"/>
  <circle cx="135" cy="55" r="3" fill="url(#goldGrad)"/>
</svg>
