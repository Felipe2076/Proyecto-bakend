{# Botón compacto de trámite / acceso rápido. Parámetros: icono, titulo, url #}
<a class="v3-tramite" href="{{ url }}" target="_blank" rel="noopener">
    <span class="v3-tramite__icono" aria-hidden="true"><i class="bi {{ icono }}"></i></span>
    <span class="v3-tramite__titulo">{{ titulo }}</span>
    <i class="bi bi-box-arrow-up-right v3-tramite__flecha" aria-hidden="true"></i><span class="visually-hidden"> (se abre en otra pestaña)</span>
</a>
