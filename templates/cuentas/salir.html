{% extends 'base.html' %}

{% block title %}Cerrar sesión | SIGED-SGR{% endblock %}

{% block content %}
<div class="container" style="max-width: 32rem;">
    <div class="card border-0 shadow-sm rounded-4 mt-4">
        <div class="card-body p-4 text-center">
            <i class="bi bi-box-arrow-right display-6 text-primary-custom" aria-hidden="true"></i>
            <h1 class="h4 fw-bold mt-2">¿Cerrar la sesión?</h1>
            <p class="text-muted">Para volver a ingresar necesitará su RUT y contraseña.</p>
            <form method="post" action="{% url 'logout' %}" class="d-flex gap-2 justify-content-center">
                {% csrf_token %}
                <a class="btn btn-outline-secondary" href="{% url 'inicio' %}">Volver</a>
                <button class="btn btn-primary-custom" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
